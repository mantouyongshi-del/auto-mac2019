<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laya 农场监控大盘</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'bg-dark': '#0f172a',
        'bg-card': '#1e293b',
        'border': '#334155',
      }
    }
  }
}
</script>
<style>
  body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .glow-green { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
  .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
  .bar-bg { background: #334155; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 0.5s; border-radius: 4px; }
</style>
</head>
<body>

<div class="bg-bg-card border-b border-border px-6 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
    <h1 class="text-xl font-bold text-white">🤖 Laya 多模型农场监控大盘</h1>
  </div>
  <div class="flex items-center gap-4 text-sm text-gray-400">
    <span id="current-time"></span>
    <button onclick="refreshAll()" class="px-3 py-1 bg-blue-600/20 text-blue-400 rounded hover:bg-blue-600/30">刷新</button>
  </div>
</div>

<div class="mx-6 mt-4 grid grid-cols-4 gap-4">
  <div class="bg-bg-card rounded-lg p-4 border border-border">
    <div class="text-gray-400 text-sm mb-2">CPU 使用率</div>
    <div class="flex items-center gap-3">
      <div class="text-2xl font-bold text-white" id="cpu-val">--</div>
      <div class="flex-1 bar-bg h-2">
        <div class="bar-fill bg-blue-500" id="cpu-bar" style="width: 0%"></div>
      </div>
    </div>
  </div>
  <div class="bg-bg-card rounded-lg p-4 border border-border">
    <div class="text-gray-400 text-sm mb-2">内存使用率</div>
    <div class="flex items-center gap-3">
      <div class="text-2xl font-bold text-white" id="mem-val">--</div>
      <div class="flex-1 bar-bg h-2">
        <div class="bar-fill bg-yellow-500" id="mem-bar" style="width: 0%"></div>
      </div>
    </div>
  </div>
  <div class="bg-bg-card rounded-lg p-4 border border-border">
    <div class="text-gray-400 text-sm mb-2">磁盘使用率</div>
    <div class="flex items-center gap-3">
      <div class="text-2xl font-bold text-white" id="disk-val">--</div>
      <div class="flex-1 bar-bg h-2">
        <div class="bar-fill bg-green-500" id="disk-bar" style="width: 0%"></div>
      </div>
    </div>
  </div>
  <div class="bg-bg-card rounded-lg p-4 border border-border">
    <div class="text-gray-400 text-sm mb-2">在线模型</div>
    <div class="text-2xl font-bold text-green-500" id="online-count">-- / 5</div>
  </div>
</div>

<div class="mx-6 mt-4 grid grid-cols-5 gap-4" id="models-grid"></div>

<div class="mx-6 mt-6 flex gap-2 border-b border-border">
  <button class="tab-btn px-4 py-2 text-sm border-b-2 border-blue-500 text-blue-400" data-tab="ask">单模型提问</button>
  <button class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-400" data-tab="batch">批量任务</button>
  <button class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-400" data-tab="tasks">任务历史</button>
  <button class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-400" data-tab="health">健康检查记录</button>
  <button class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-400" data-tab="backup">日志管理</button>
</div>

<div class="mx-6 mt-4 mb-8">
  <div id="tab-ask" class="tab-content">
    <div class="bg-bg-card rounded-lg p-5 border border-border">
      <div class="mb-3 text-sm text-gray-400">选择模型：</div>
      <div class="flex gap-2 mb-4 flex-wrap" id="single-model-select"></div>
      <textarea id="single-question" class="w-full h-24 bg-slate-800 border border-border rounded p-3 text-white mb-3" placeholder="输入问题..."></textarea>
      <button onclick="askSingle()" class="px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-500">发送提问</button>
      <div id="single-result" class="mt-4 hidden">
        <div class="text-gray-400 text-sm mb-2">回答结果：</div>
        <div id="single-answer" class="bg-slate-800 rounded p-3 text-sm whitespace-pre-wrap"></div>
        <div id="single-citations" class="mt-2 text-sm"></div>
      </div>
    </div>
  </div>

  <div id="tab-batch" class="tab-content hidden">
    <div class="bg-bg-card rounded-lg p-5 border border-border">
      <div class="mb-3 text-sm text-gray-400">批量问题（每行一个）：</div>
      <textarea id="batch-questions" class="w-full h-32 bg-slate-800 border border-border rounded p-3 text-white mb-3" placeholder="问题1&#10;问题2&#10;..."></textarea>
      <div class="mb-3 text-sm text-gray-400">问题间隔：<span id="delay-display">5-10秒</span>（随机）</div>
      <input type="range" id="delay-range" min="3" max="15" value="7" class="w-48" oninput="document.getElementById('delay-display').textContent=this.value+'-'+(parseInt(this.value)+3)+'秒'">
      <button onclick="createBatchTask()" class="ml-4 px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-500">创建任务</button>
    </div>
  </div>

  <div id="tab-tasks" class="tab-content hidden">
    <div class="bg-bg-card rounded-lg p-5 border border-border">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-gray-400 border-b border-border">
            <th class="text-left py-2">任务ID</th>
            <th class="text-left py-2">状态</th>
            <th class="text-left py-2">进度</th>
            <th class="text-left py-2">创建时间</th>
            <th class="text-left py-2">操作</th>
          </tr>
        </thead>
        <tbody id="tasks-table"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-health" class="tab-content hidden">
    <div class="bg-bg-card rounded-lg p-5 border border-border">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-gray-400 border-b border-border">
            <th class="text-left py-2">时间</th>
            <th class="text-left py-2">状态</th>
            <th class="text-left py-2">异常详情</th>
          </tr>
        </thead>
        <tbody id="health-table"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-backup" class="tab-content hidden">
    <div class="bg-bg-card rounded-lg p-5 border border-border">
      <div class="flex gap-3 mb-4">
        <button onclick="backupLogs()" class="px-4 py-2 bg-blue-600 text-white rounded">备份日志</button>
        <button onclick="cleanupLogs()" class="px-4 py-2 bg-yellow-600 text-white rounded">清理7天前日志</button>
      </div>
      <table class="w-full text-sm">
        <thead>
          <tr class="text-gray-400 border-b border-border">
            <th class="text-left py-2">时间</th>
            <th class="text-left py-2">操作</th>
            <th class="text-left py-2">详情</th>
          </tr>
        </thead>
        <tbody id="backup-table"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let selectedModel = 'deepseek';
const MODEL_PORT = {deepseek:8000, qianwen:8001, doubao:8002, wenxin:8003, yuanbao:8004};
const MODELS = [
  {id: 'deepseek', name: 'DeepSeek'},
  {id: 'qianwen', name: '千问'},
  {id: 'doubao', name: '豆包'},
  {id: 'wenxin', name: '文心一言'},
  {id: 'yuanbao', name: '元宝'},
];

window.onload = function() {
  initModelCards();
  initSingleModelSelect();
  initTabs();
  refreshAll();
  setInterval(refreshAll, 5000);
  setInterval(() => {
    document.getElementById('current-time').textContent = new Date().toLocaleString('zh-CN');
  }, 1000);
};

function initModelCards() {
  const grid = document.getElementById('models-grid');
  grid.innerHTML = MODELS.map(m => `
    <div class="bg-bg-card rounded-lg p-4 border border-border text-center" id="card-${m.id}">
      <div class="text-lg font-bold text-white mb-2">${m.name}</div>
      <div class="flex items-center justify-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-gray-500" id="dot-${m.id}"></div>
        <span class="text-sm text-gray-400" id="status-${m.id}">未知</span>
      </div>
    </div>
  `).join('');
}

function initSingleModelSelect() {
  const sel = document.getElementById('single-model-select');
  sel.innerHTML = MODELS.map(m => `
    <button class="model-btn px-4 py-1.5 rounded border text-sm ${m.id === selectedModel ? 'bg-blue-600/20 text-blue-400 border-blue-500' : 'border-border text-gray-400'}" data-mid="${m.id}" onclick="selectModel('${m.id}')">${m.name}</button>
  `).join('');
}

function selectModel(mid) {
  selectedModel = mid;
  document.querySelectorAll('.model-btn').forEach(btn => {
    if (btn.dataset.mid === mid) {
      btn.className = 'model-btn px-4 py-1.5 rounded border text-sm bg-blue-600/20 text-blue-400 border-blue-500';
    } else {
      btn.className = 'model-btn px-4 py-1.5 rounded border text-sm border-border text-gray-400';
    }
  });
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-gray-400';
      });
      btn.className = 'tab-btn px-4 py-2 text-sm border-b-2 border-blue-500 text-blue-400';
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
      if (btn.dataset.tab === 'tasks') loadTasks();
      if (btn.dataset.tab === 'health') loadHealthHistory();
      if (btn.dataset.tab === 'backup') loadBackupRecords();
    };
  });
}

async function refreshAll() {
  await Promise.all([loadModelStatus(), loadSystemHealth()]);
}

async function loadModelStatus() {
  const res = await fetch('/api/models');
  const data = await res.json();
  let online = 0;
  data.models.forEach(m => {
    const dot = document.getElementById('dot-' + m.id);
    const status = document.getElementById('status-' + m.id);
    const card = document.getElementById('card-' + m.id);
    if (m.status === 'online') {
      dot.className = 'w-2.5 h-2.5 rounded-full bg-green-500';
      status.textContent = '在线';
      card.className = 'bg-bg-card rounded-lg p-4 border border-green-500/50 text-center glow-green';
      online++;
    } else {
      dot.className = 'w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse';
      status.textContent = '离线';
      card.className = 'bg-bg-card rounded-lg p-4 border border-red-500/50 text-center glow-red';
    }
  });
  document.getElementById('online-count').textContent = online + ' / 5';
}

async function loadSystemHealth() {
  const res = await fetch('/api/health');
  const data = await res.json();
  document.getElementById('cpu-val').textContent = data.cpu_percent + '%';
  document.getElementById('cpu-bar').style.width = data.cpu_percent + '%';
  document.getElementById('mem-val').textContent = data.mem_used_percent + '%';
  document.getElementById('mem-bar').style.width = data.mem_used_percent + '%';
  document.getElementById('disk-val').textContent = data.disk_used_percent + '%';
  document.getElementById('disk-bar').style.width = data.disk_used_percent + '%';
}

async function askSingle() {
  const q = document.getElementById('single-question').value.trim();
  if (!q) return alert('请输入问题');
  const res = await fetch(`http://127.0.0.1:${MODEL_PORT[selectedModel]}/ask`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q})
  });
  const data = await res.json();
  document.getElementById('single-result').classList.remove('hidden');
  document.getElementById('single-answer').textContent = data.answer || JSON.stringify(data);
  document.getElementById('single-citations').innerHTML = (data.citations || []).map(c => `<a href="${c.url}" target="_blank" class="text-blue-400">${c.ref}</a>`).join(' | ');
}

async function createBatchTask() {
  const qs = document.getElementById('batch-questions').value.trim().split('\n').filter(x => x.trim());
  if (qs.length === 0) return alert('请输入问题');
  const delay = parseInt(document.getElementById('delay-range').value);
  const res = await fetch('/api/tasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({questions: qs, delay_min: delay, delay_max: delay + 3})
  });
  const data = await res.json();
  alert('任务已创建：' + data.task_id);
  document.querySelector('[data-tab="tasks"]').click();
}

async function loadTasks() {
  const res = await fetch('/api/tasks');
  const data = await res.json();
  document.getElementById('tasks-table').innerHTML = data.tasks.map(t => `
    <tr class="border-b border-border/50">
      <td class="py-2 text-gray-300">${t.task_id}</td>
      <td class="py-2"><span class="px-2 py-0.5 rounded text-xs ${t.status === 'completed' ? 'bg-green-500/20 text-green-400' : t.status === 'running' ? 'bg-blue-500/20 text-blue-400' : 'bg-yellow-500/20 text-yellow-400'}">${t.status}</span></td>
      <td class="py-2 text-gray-300">${t.completed} / ${t.total}</td>
      <td class="py-2 text-gray-400">${new Date(t.created_at).toLocaleString('zh-CN')}</td>
      <td class="py-2">
        <button onclick="exportTask('${t.task_id}')" class="text-blue-400 text-xs mr-2">导出CSV</button>
        ${t.status === 'running' ? `<button onclick="cancelTask('${t.task_id}')" class="text-red-400 text-xs mr-2">取消</button>` : ''}
      </td>
    </tr>
  `).join('');
}

async function exportTask(tid) {
  const res = await fetch(`/api/tasks/${tid}/export`);
  const data = await res.json();
  const blob = new Blob([data.csv], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = tid + '.csv';
  a.click();
}

async function cancelTask(tid) {
  await fetch(`/api/tasks/${tid}/cancel`, {method: 'POST'});
  loadTasks();
}

async function loadHealthHistory() {
  const res = await fetch('/api/health_history');
  const data = await res.json();
  document.getElementById('health-table').innerHTML = data.history.map(h => `
    <tr class="border-b border-border/50">
      <td class="py-2 text-gray-400">${new Date(h.time).toLocaleString('zh-CN')}</td>
      <td class="py-2"><span class="px-2 py-0.5 rounded text-xs ${h.abnormal.length === 0 ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">${h.abnormal.length === 0 ? '正常' : '异常'}</span></td>
      <td class="py-2 text-gray-300">${h.abnormal.join(', ') || '-'}</td>
    </tr>
  `).join('');
}

async function backupLogs() {
  await fetch('/api/backup_logs', {method: 'POST'});
  alert('备份完成');
  loadBackupRecords();
}

async function cleanupLogs() {
  if (!confirm('确定清理7天前的日志？')) return;
  await fetch('/api/cleanup_logs', {method: 'POST'});
  loadBackupRecords();
}

async function loadBackupRecords() {
  const res = await fetch('/api/backup_records');
  const data = await res.json();
  document.getElementById('backup-table').innerHTML = data.records.map(r => `
    <tr class="border-b border-border/50">
      <td class="py-2 text-gray-400">${new Date(r.time).toLocaleString('zh-CN')}</td>
      <td class="py-2">${r.action === 'backup' ? '备份日志' : '清理日志'}</td>
      <td class="py-2 text-gray-300">${r.size_mb ? '大小: ' + r.size_mb + 'MB' : '删除: ' + r.deleted_count + '个文件'}</td>
    </tr>
  `).join('');
}
</script>

</body>
</html>
