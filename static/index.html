<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Laya AI Farm 数据驾驶舱</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
  body { 
    background: #030712;
    font-family: 'PingFang SC', sans-serif;
    overflow-x: hidden;
  }
  .bg-glow {
    background: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168,85,247,0.15) 0%, transparent 50%);
  }
  .panel {
    background: linear-gradient(180deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.9) 100%);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    position: relative;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #3b82f6, transparent);
  }
  .panel-title {
    font-size: 13px;
    color: #60a5fa;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .num-big {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(180deg, #fff 0%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot-green { background:#10b981; box-shadow:0 0 8px #10b981; }
  .dot-red { background:#ef4444; box-shadow:0 0 8px #ef4444; }
  .dot-yellow { background:#f59e0b; box-shadow:0 0 8px #f59e0b; }
  .dot-gray { background:#64748b; }
  .scroll-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
  .scroll-list::-webkit-scrollbar { width: 4px; }
  .scroll-list::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 2px; }
</style>
</head>
<body class="bg-glow min-h-screen text-slate-200">

<div class="p-4">
  <!-- 顶部标题栏 -->
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">
        🚀 LAYA AI FARM 数据驾驶舱
      </h1>
      <div class="text-xs text-slate-500 mt-1" id="current-time"></div>
    </div>
    <div class="flex gap-2 items-center">
      <button onclick="switchPage('overview')" id="tab-overview" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 rounded-lg text-sm border border-blue-500/30 hover:bg-blue-600/30">📊 总览</button>
      <button onclick="switchPage('batch')" id="tab-batch" class="px-3 py-1.5 bg-slate-700/30 text-slate-400 rounded-lg text-sm border border-slate-600/30 hover:bg-slate-600/40">🚀 跑批监控</button>
      <button onclick="toggleFs()" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 rounded-lg text-sm border border-blue-500/30 hover:bg-blue-600/30">⛶ 全屏</button>
    </div>
  </div>

  <!-- 总览页 -->
  <div id="page-overview">

  <!-- KPI 行 -->
  <div class="grid grid-cols-6 gap-3 mb-4">
    <div class="panel p-4">
      <div class="text-xs text-slate-500">在线模型</div>
      <div class="num-big" id="kpi-online">4/5</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">今日任务</div>
      <div class="num-big text-green-400" id="kpi-today">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">今日成功</div>
      <div class="num-big text-emerald-400" id="kpi-success">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">今日失败</div>
      <div class="num-big text-red-400" id="kpi-fail">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">队列任务</div>
      <div class="num-big text-yellow-400" id="kpi-queue">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">平均响应</div>
      <div class="num-big text-purple-400" id="kpi-resp">--</div>
    </div>
  </div>

  <!-- 模型状态行 -->
  <div class="grid grid-cols-5 gap-3 mb-4" id="model-cards"></div>

  <!-- 图表行1 -->
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="panel p-4">
      <div class="panel-title">📈 7日任务量趋势</div>
      <div id="chart7day" style="height:200px"></div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">🎯 模型成功率对比</div>
      <div id="chartsuccess" style="height:200px"></div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">💻 CPU/内存实时</div>
      <div id="chartresource" style="height:200px"></div>
    </div>
  </div>

  <!-- 图表行2 -->
  <div class="grid grid-cols-3 gap-3">
    <div class="panel p-4">
      <div class="panel-title">⚡ 实时请求吞吐</div>
      <div id="chartthroughput" style="height:200px"></div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">🔔 最近事件流</div>
      <div class="scroll-list" id="event-list">
        <div class="py-1 border-b border-slate-700/50">✅ 系统启动</div>
      </div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">📊 任务状态分布</div>
      <div id="chartpie" style="height:200px"></div>
    </div>
  </div>

  <!-- 账号记录 -->
  <div class="panel p-4 mt-4">
    <div class="panel-title">👤 模型账号记录（封禁/换号台账）</div>
    <div class="overflow-x-auto">
      <table class="w-full text-xs">
        <thead>
          <tr class="text-slate-400 border-b border-slate-700/50">
            <th class="text-left py-2 pr-3">模型</th>
            <th class="text-left py-2 pr-3">账号</th>
            <th class="text-left py-2 pr-3">状态</th>
            <th class="text-left py-2 pr-3">封禁到期</th>
            <th class="text-left py-2 pr-3">备注</th>
            <th class="text-left py-2 pr-3">更新时间</th>
            <th class="text-left py-2">操作</th>
          </tr>
        </thead>
        <tbody id="account-tbody"></tbody>
      </table>
    </div>
    <!-- 新增记录 -->
    <div class="flex flex-wrap gap-2 mt-3 items-end">
      <select id="ac-model" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs">
        <option value="deepseek">DeepSeek</option>
        <option value="qianwen">通义千问</option>
        <option value="doubao">豆包</option>
        <option value="wenxin">文心一言</option>
        <option value="yuanbao">腾讯元宝</option>
      </select>
      <input id="ac-phone" placeholder="账号（手机号/ID）" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs w-36">
      <select id="ac-status" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs">
        <option value="active">正常</option>
        <option value="banned">封禁</option>
        <option value="paused">暂停</option>
      </select>
      <input id="ac-banuntil" placeholder="封禁到期(如2026-10-07)" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs w-44">
      <input id="ac-note" placeholder="备注" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs flex-1 min-w-40">
      <button onclick="addAccount()" class="px-3 py-1 bg-blue-600/30 text-blue-300 rounded text-xs border border-blue-500/40 hover:bg-blue-600/40">+ 新增记录</button>
    </div>
  </div>
</div>

<!-- 跑批监控页 -->
<div id="page-batch" style="display:none">
  <!-- 状态行 -->
  <div class="grid grid-cols-6 gap-3 mb-4">
    <div class="panel p-4">
      <div class="text-xs text-slate-500">跑批状态</div>
      <div class="num-big" id="bs-status">--</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">累计完成</div>
      <div class="num-big text-green-400" id="bs-total">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">累计失败</div>
      <div class="num-big text-red-400" id="bs-fail">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">累计跳过</div>
      <div class="num-big text-slate-400" id="bs-skip">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">当前行业题数</div>
      <div class="num-big text-yellow-400" id="bs-indtotal">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">状态更新</div>
      <div class="text-sm text-slate-300 mt-2" id="bs-updated">--</div>
    </div>
  </div>

  <!-- 当前行业 + 进度条 -->
  <div class="panel p-4 mb-4">
    <div class="flex justify-between items-center mb-2">
      <div class="panel-title mb-0">🏭 当前行业</div>
      <div class="text-sm text-slate-300" id="bs-industry">--</div>
    </div>
    <div class="flex items-center gap-3 mb-1">
      <div class="text-xs text-slate-400">第 <span id="bs-no" class="text-blue-400 font-bold text-base">0</span> / <span id="bs-totalno">0</span> 题</div>
    </div>
    <div class="w-full bg-slate-800 rounded-full h-3">
      <div id="bs-progress" class="h-3 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 transition-all" style="width:0%"></div>
    </div>
    <div class="text-xs text-slate-400 mt-2 truncate">当前问题：<span id="bs-question" class="text-slate-200">--</span></div>
  </div>

  <!-- 5模型状态卡 -->
  <div class="grid grid-cols-5 gap-3 mb-4" id="bs-model-cards"></div>

  <!-- 最近10题 -->
  <div class="panel p-4">
    <div class="panel-title">🕐 最近提问（10条）</div>
    <div class="scroll-list" id="bs-recent" style="max-height:300px"></div>
  </div>
</div>

<script>
const models = [
  {id:'deepseek', name:'DeepSeek', color:'#6366f1'},
  {id:'qianwen', name:'通义千问', color:'#0ea5e9'},
  {id:'doubao', name:'豆包', color:'#10b981'},
  {id:'wenxin', name:'文心一言', color:'#f59e0b'},
  {id:'yuanbao', name:'腾讯元宝', color:'#ec4899'}
];

const c7 = echarts.init(document.getElementById('chart7day'));
const cs = echarts.init(document.getElementById('chartsuccess'));
const cr = echarts.init(document.getElementById('chartresource'));
const ct = echarts.init(document.getElementById('chartthroughput'));
const cp = echarts.init(document.getElementById('chartpie'));

let tData=[], cpuData=[], memData=[], events=[];

function toggleFs(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){ alert("请用浏览器窗口打开全屏，当前内嵌页面不支持"); } }
function updateTime(){ document.getElementById('current-time').innerText = new Date().toLocaleString('zh-CN'); }
setInterval(updateTime,1000); updateTime();

async function refresh(){
  try {
    const res = await axios.get('/api/models');
    const md = res.data.models || [];
    let online = 0;
    
    document.getElementById('model-cards').innerHTML = models.map(m=>{
      const s = md.find(x=>x.id===m.id)||{};
      const ok = s.status==='online';
      const paused = s.paused;
      if(ok&&!paused) online++;
      const dot = paused?'dot-gray':(ok?'dot-green':'dot-red');
      const status = paused?'已暂停':(ok?'在线运行':'异常');
      return `<div class="panel p-3 text-center">
        <div class="text-base font-semibold mb-2" style="color:${m.color}">${m.name}</div>
        <div class="text-sm"><span class="dot ${dot}"></span> ${status}</div>
        <div class="text-xs text-slate-500 mt-1">端口 ${s.port||'--'}</div>
      </div>`;
    }).join('');
    document.getElementById('kpi-online').innerText = online + '/5';

    const res2 = await axios.get('/api/resource');
    const now = new Date().toLocaleTimeString();
    tData.push(now); cpuData.push(res2.data.cpu_percent); memData.push(res2.data.mem_percent);
    if(tData.length>15){tData.shift();cpuData.shift();memData.shift();}

    cr.setOption({
      tooltip:{trigger:'axis'}, legend:{data:['CPU','内存'],textStyle:{color:'#94a3b8'},top:0},
      grid:{left:35,right:15,top:25,bottom:25},
      xAxis:{type:'category',data:tData,axisLabel:{color:'#475569',fontSize:9}},
      yAxis:{type:'value',max:100,axisLabel:{color:'#475569'}},
      series:[
        {name:'CPU',type:'line',smooth:true,data:cpuData,itemStyle:{color:'#3b82f6'},areaStyle:{color:'#3b82f620'}},
        {name:'内存',type:'line',smooth:true,data:memData,itemStyle:{color:'#a855f7'},areaStyle:{color:'#a855f720'}}
      ]
    });

    ct.setOption({
      tooltip:{trigger:'axis'},
      grid:{left:35,right:15,top:15,bottom:25},
      xAxis:{type:'category',data:tData,axisLabel:{color:'#475569',fontSize:9}},
      yAxis:{type:'value',axisLabel:{color:'#475569'}},
      series:[{type:'bar',data:Array(15).fill(0).map(()=>Math.random()*3),itemStyle:{color:'#06b6d4',borderRadius:[3,3,0,0]}}]
    });

    c7.setOption({
      tooltip:{},
      grid:{left:35,right:15,top:15,bottom:25},
      xAxis:{type:'category',data:['周一','周二','周三','周四','周五','周六','周日'],axisLabel:{color:'#475569'}},
      yAxis:{type:'value',axisLabel:{color:'#475569'}},
      series:[{type:'line',smooth:true,data:[12,19,15,25,22,8,5],areaStyle:{color:'#3b82f630'},lineStyle:{color:'#3b82f6'}}]
    });

    cs.setOption({
      tooltip:{},
      radar:{
        indicator: models.map(m=>({name:m.name, max:100})),
        axisName:{color:'#94a3b8',fontSize:10}
      },
      series:[{type:'radar',data:[{value:[95,98,92,88,96],name:'成功率',areaStyle:{color:'#10b98130'},lineStyle:{color:'#10b981'}}]}]
    });

    cp.setOption({
      tooltip:{},
      series:[{type:'pie',radius:['40%','65%'],label:{color:'#94a3b8',fontSize:10},
        data:[
          {value:120,name:'成功',itemStyle:{color:'#10b981'}},
          {value:8,name:'失败',itemStyle:{color:'#ef4444'}},
          {value:3,name:'运行中',itemStyle:{color:'#f59e0b'}},
          {value:5,name:'排队',itemStyle:{color:'#3b82f6'}}
        ]}]
    });

    document.getElementById('kpi-today').innerText = '136';
    document.getElementById('kpi-success').innerText = '128';
    document.getElementById('kpi-fail').innerText = '8';
    document.getElementById('kpi-queue').innerText = '0';
    document.getElementById('kpi-resp').innerText = '12.3s';
  } catch(e){ console.error(e); }
}

// ---------- 账号记录 ----------
const AC_STATUS = {active:'🟢 正常', banned:'🔴 封禁', paused:'🟡 暂停'};

async function loadAccounts(){
  try {
    const res = await axios.get('/api/accounts');
    const list = res.data.accounts || [];
    const tbody = document.getElementById('account-tbody');
    tbody.innerHTML = list.map((a, i)=>`
      <tr class="border-b border-slate-800/60">
        <td class="py-2 pr-3">${a.model}</td>
        <td class="py-2 pr-3 font-mono">${a.phone||''}</td>
        <td class="py-2 pr-3">
          <select onchange="setAccStatus(${i}, this.value)" class="bg-slate-800 border border-slate-700 rounded px-1 text-xs">
            ${Object.keys(AC_STATUS).map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${AC_STATUS[s]}</option>`).join('')}
          </select>
        </td>
        <td class="py-2 pr-3">${a.ban_until||'--'}</td>
        <td class="py-2 pr-3 text-slate-400 max-w-52 truncate" title="${a.note||''}">${a.note||'--'}</td>
        <td class="py-2 pr-3 text-slate-500">${(a.updated_at||'').slice(0,16).replace('T',' ')}</td>
        <td class="py-2">
          <button onclick="delAccount(${i})" class="text-red-400 hover:text-red-300">删除</button>
        </td>
      </tr>`).join('') || `<tr><td colspan="7" class="py-3 text-slate-500">暂无账号记录</td></tr>`;
  } catch(e){ console.error(e); }
}

async function addAccount(){
  const model = document.getElementById('ac-model').value;
  const phone = document.getElementById('ac-phone').value.trim();
  const status = document.getElementById('ac-status').value;
  const ban_until = document.getElementById('ac-banuntil').value.trim() || null;
  const note = document.getElementById('ac-note').value.trim();
  if(!phone){ alert('请填写账号'); return; }
  await axios.post('/api/accounts', {model, phone, status, ban_until, note});
  document.getElementById('ac-phone').value=''; document.getElementById('ac-note').value='';
  loadAccounts();
}

async function setAccStatus(idx, status){
  await axios.put(`/api/accounts/${idx}`, {status});
  loadAccounts();
}

async function delAccount(idx){
  if(!confirm('确认删除该账号记录？')) return;
  await axios.delete(`/api/accounts/${idx}`);
  loadAccounts();
}

// ---------- 页面切换 ----------
function switchPage(p){
  document.getElementById('page-overview').style.display = p==='overview'?'':'none';
  document.getElementById('page-batch').style.display = p==='batch'?'':'none';
  document.getElementById('tab-overview').className = p==='overview' ? 'px-3 py-1.5 bg-blue-600/20 text-blue-400 rounded-lg text-sm border border-blue-500/30' : 'px-3 py-1.5 bg-slate-700/30 text-slate-400 rounded-lg text-sm border border-slate-600/30';
  document.getElementById('tab-batch').className = p==='batch' ? 'px-3 py-1.5 bg-blue-600/20 text-blue-400 rounded-lg text-sm border border-blue-500/30' : 'px-3 py-1.5 bg-slate-700/30 text-slate-400 rounded-lg text-sm border border-slate-600/30';
  if(p==='batch') refreshBatch();
}

// ---------- 跑批监控 ----------
function fmtRel(iso){
  if(!iso) return '--';
  const d = new Date(iso);
  const s = (Date.now()-d.getTime())/1000;
  if(s<0) return '刚刚';
  if(s<60) return Math.floor(s)+'秒前';
  if(s<3600) return Math.floor(s/60)+'分钟前';
  return Math.floor(s/3600)+'小时前';
}

async function refreshBatch(){
  try {
    const res = await axios.get('/api/batch_status');
    const s = res.data;
    const alive = s.runner_alive;
    document.getElementById('bs-status').innerText = !alive ? '未运行' : (s.status==='resting' ? '休息中' : (s.status==='done' ? '完成' : '运行中'));
    document.getElementById('bs-status').className = 'num-big ' + (!alive ? 'text-red-400' : (s.status==='resting' ? 'text-yellow-400' : 'text-green-400'));
    document.getElementById('bs-total').innerText = s.total_asked||0;
    document.getElementById('bs-fail').innerText = s.total_failed||0;
    document.getElementById('bs-skip').innerText = s.total_skipped||0;
    document.getElementById('bs-indtotal').innerText = s.industry_total||0;
    document.getElementById('bs-updated').innerText = s.updated_at ? fmtRel(s.updated_at) : '--';
    document.getElementById('bs-industry').innerText = s.industry_name ? `行业${s.industry_id||''} ${s.industry_name}` : '--';
    document.getElementById('bs-no').innerText = s.current_no||0;
    document.getElementById('bs-totalno').innerText = s.industry_total||0;
    const pct = s.industry_total ? Math.round((s.current_no||0)/s.industry_total*100) : 0;
    document.getElementById('bs-progress').style.width = pct+'%';
    document.getElementById('bs-question').innerText = s.current_question||'--';

    // 模型状态卡
    const models = ['deepseek','qianwen','doubao','wenxin','yuanbao'];
    document.getElementById('bs-model-cards').innerHTML = models.map(id=>{
      const m = {deepseek:['DeepSeek','#6366f1'],qianwen:['通义千问','#0ea5e9'],doubao:['豆包','#10b981'],wenxin:['文心一言','#f59e0b'],yuanbao:['腾讯元宝','#ec4899']}[id];
      const st = (s.models||{})[id]||{};
      const last = st.last_result==='ok' ? '成功' : (st.last_result==='error' ? '失败' : '待命');
      const dot = st.last_result==='ok' ? 'dot-green' : (st.last_result==='error' ? 'dot-red' : 'dot-gray');
      return `<div class="panel p-3 text-center">
        <div class="text-base font-semibold mb-1" style="color:${m[1]}">${m[0]}</div>
        <div class="text-sm"><span class="dot ${dot}"></span> ${last}</div>
        <div class="text-xs text-slate-500 mt-1">${st.last_ask?fmtRel(st.last_ask):'本轮未参与'}</div>
        <div class="text-xs mt-1"><span class="text-emerald-400">✓${st.run_ok||0}</span> <span class="text-red-400">✗${st.run_err||0}</span></div>
      </div>`;
    }).join('');

    // 最近10题
    const recent = (s.recent||[]).map(r=>{
      const fail = (r.failed||[]).length ? `<span class="text-red-400">[失败:${r.failed.join(',')}]</span>` : '<span class="text-emerald-400">✓</span>';
      return `<div class="py-1.5 border-b border-slate-800/60 flex gap-2">
        <span class="text-slate-500 w-16 shrink-0">${r.time||''}</span>
        <span class="text-slate-300 w-12 shrink-0">#${r.no||''}</span>
        <span class="truncate flex-1" title="${r.question||''}">${r.question||''}</span>
        ${fail}
      </div>`;
    }).join('') || '<div class="py-2 text-slate-500">暂无记录</div>';
    document.getElementById('bs-recent').innerHTML = recent;
  } catch(e){ console.error(e); }
}

refresh(); setInterval(refresh,3000);
loadAccounts();
setInterval(refreshBatch,3000);
</script>
