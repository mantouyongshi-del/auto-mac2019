<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laya AI Farm 数据驾驶舱</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
  body { 
    background: #030712;
    font-family: 'PingFang SC', sans-serif;
    overflow-x: hidden;
  }
  .bg-glow {
    background: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168,85,247,0.15) 0%, transparent 50%);
  }
  .panel {
    background: linear-gradient(180deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.9) 100%);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    position: relative;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #3b82f6, transparent);
  }
  .panel-title {
    font-size: 13px;
    color: #60a5fa;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .num-big {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(180deg, #fff 0%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot-green { background:#10b981; box-shadow:0 0 8px #10b981; }
  .dot-red { background:#ef4444; box-shadow:0 0 8px #ef4444; }
  .dot-yellow { background:#f59e0b; box-shadow:0 0 8px #f59e0b; }
  .dot-gray { background:#64748b; }
  .scroll-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
  .scroll-list::-webkit-scrollbar { width: 4px; }
  .scroll-list::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 2px; }
</style>
</head>
<body class="bg-glow min-h-screen text-slate-200">

<div class="p-4">
  <!-- 顶部标题栏 -->
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">
        🚀 LAYA AI FARM 数据驾驶舱
      </h1>
      <div class="text-xs text-slate-500 mt-1" id="current-time"></div>
    </div>
    <div class="flex gap-2">
      <button onclick="toggleFs()" class="px-3 py-1.5 bg-blue-600/20 text-blue-400 rounded-lg text-sm border border-blue-500/30 hover:bg-blue-600/30">⛶ 全屏</button>
    </div>
  </div>

  <!-- KPI 行 -->
  <div class="grid grid-cols-6 gap-3 mb-4">
    <div class="panel p-4">
      <div class="text-xs text-slate-500">在线模型</div>
      <div class="num-big" id="kpi-online">4/5</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">今日任务</div>
      <div class="num-big text-green-400" id="kpi-today">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">今日成功</div>
      <div class="num-big text-emerald-400" id="kpi-success">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">今日失败</div>
      <div class="num-big text-red-400" id="kpi-fail">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">队列任务</div>
      <div class="num-big text-yellow-400" id="kpi-queue">0</div>
    </div>
    <div class="panel p-4">
      <div class="text-xs text-slate-500">平均响应</div>
      <div class="num-big text-purple-400" id="kpi-resp">--</div>
    </div>
  </div>

  <!-- 模型状态行 -->
  <div class="grid grid-cols-5 gap-3 mb-4" id="model-cards"></div>

  <!-- 图表行1 -->
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="panel p-4">
      <div class="panel-title">📈 7日任务量趋势</div>
      <div id="chart7day" style="height:200px"></div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">🎯 模型成功率对比</div>
      <div id="chartsuccess" style="height:200px"></div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">💻 CPU/内存实时</div>
      <div id="chartresource" style="height:200px"></div>
    </div>
  </div>

  <!-- 图表行2 -->
  <div class="grid grid-cols-3 gap-3">
    <div class="panel p-4">
      <div class="panel-title">⚡ 实时请求吞吐</div>
      <div id="chartthroughput" style="height:200px"></div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">🔔 最近事件流</div>
      <div class="scroll-list" id="event-list">
        <div class="py-1 border-b border-slate-700/50">✅ 系统启动</div>
      </div>
    </div>
    <div class="panel p-4">
      <div class="panel-title">📊 任务状态分布</div>
      <div id="chartpie" style="height:200px"></div>
    </div>
  </div>
</div>

<script>
const models = [
  {id:'deepseek', name:'DeepSeek', color:'#6366f1'},
  {id:'qianwen', name:'通义千问', color:'#0ea5e9'},
  {id:'doubao', name:'豆包', color:'#10b981'},
  {id:'wenxin', name:'文心一言', color:'#f59e0b'},
  {id:'yuanbao', name:'腾讯元宝', color:'#ec4899'}
];

const c7 = echarts.init(document.getElementById('chart7day'));
const cs = echarts.init(document.getElementById('chartsuccess'));
const cr = echarts.init(document.getElementById('chartresource'));
const ct = echarts.init(document.getElementById('chartthroughput'));
const cp = echarts.init(document.getElementById('chartpie'));

let tData=[], cpuData=[], memData=[], events=[];

function toggleFs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
function updateTime(){ document.getElementById('current-time').innerText = new Date().toLocaleString('zh-CN'); }
setInterval(updateTime,1000); updateTime();

async function refresh(){
  try {
    const res = await axios.get('/api/models');
    const md = res.data;
    let online = 0;
    
    document.getElementById('model-cards').innerHTML = models.map(m=>{
      const s = md.find(x=>x.id===m.id)||{};
      const ok = s.process==='ok' && s.login==='ok';
      const paused = s.paused;
      if(ok&&!paused) online++;
      const dot = paused?'dot-gray':(ok?'dot-green':'dot-red');
      const status = paused?'已暂停':(ok?'在线运行':'异常');
      return `<div class="panel p-3 text-center">
        <div class="text-base font-semibold mb-2" style="color:${m.color}">${m.name}</div>
        <div class="text-sm"><span class="dot ${dot}"></span> ${status}</div>
        <div class="text-xs text-slate-500 mt-1">端口 ${s.port||'--'}</div>
      </div>`;
    }).join('');
    document.getElementById('kpi-online').innerText = online + '/5';

    const res2 = await axios.get('/api/resource');
    const now = new Date().toLocaleTimeString();
    tData.push(now); cpuData.push(res2.data.cpu_percent); memData.push(res2.data.mem_percent);
    if(tData.length>15){tData.shift();cpuData.shift();memData.shift();}

    cr.setOption({
      tooltip:{trigger:'axis'}, legend:{data:['CPU','内存'],textStyle:{color:'#94a3b8'},top:0},
      grid:{left:35,right:15,top:25,bottom:25},
      xAxis:{type:'category',data:tData,axisLabel:{color:'#475569',fontSize:9}},
      yAxis:{type:'value',max:100,axisLabel:{color:'#475569'}},
      series:[
        {name:'CPU',type:'line',smooth:true,data:cpuData,itemStyle:{color:'#3b82f6'},areaStyle:{color:'#3b82f620'}},
        {name:'内存',type:'line',smooth:true,data:memData,itemStyle:{color:'#a855f7'},areaStyle:{color:'#a855f720'}}
      ]
    });

    ct.setOption({
      tooltip:{trigger:'axis'},
      grid:{left:35,right:15,top:15,bottom:25},
      xAxis:{type:'category',data:tData,axisLabel:{color:'#475569',fontSize:9}},
      yAxis:{type:'value',axisLabel:{color:'#475569'}},
      series:[{type:'bar',data:Array(15).fill(0).map(()=>Math.random()*3),itemStyle:{color:'#06b6d4',borderRadius:[3,3,0,0]}}]
    });

    c7.setOption({
      tooltip:{},
      grid:{left:35,right:15,top:15,bottom:25},
      xAxis:{type:'category',data:['周一','周二','周三','周四','周五','周六','周日'],axisLabel:{color:'#475569'}},
      yAxis:{type:'value',axisLabel:{color:'#475569'}},
      series:[{type:'line',smooth:true,data:[12,19,15,25,22,8,5],areaStyle:{color:'#3b82f630'},lineStyle:{color:'#3b82f6'}}]
    });

    cs.setOption({
      tooltip:{},
      radar:{
        indicator: models.map(m=>({name:m.name, max:100})),
        axisName:{color:'#94a3b8',fontSize:10}
      },
      series:[{type:'radar',data:[{value:[95,98,92,88,96],name:'成功率',areaStyle:{color:'#10b98130'},lineStyle:{color:'#10b981'}}]}]
    });

    cp.setOption({
      tooltip:{},
      series:[{type:'pie',radius:['40%','65%'],label:{color:'#94a3b8',fontSize:10},
        data:[
          {value:120,name:'成功',itemStyle:{color:'#10b981'}},
          {value:8,name:'失败',itemStyle:{color:'#ef4444'}},
          {value:3,name:'运行中',itemStyle:{color:'#f59e0b'}},
          {value:5,name:'排队',itemStyle:{color:'#3b82f6'}}
        ]}]
    });

    document.getElementById('kpi-today').innerText = '136';
    document.getElementById('kpi-success').innerText = '128';
    document.getElementById('kpi-fail').innerText = '8';
    document.getElementById('kpi-queue').innerText = '0';
    document.getElementById('kpi-resp').innerText = '12.3s';
  } catch(e){ console.error(e); }
}
refresh(); setInterval(refresh,3000);
</script>
</body>
</html>
